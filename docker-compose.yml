services:
  app:
    build:
      context: .
      args:
        VITE_API_BASE_URL: /api
    env_file:
      - apps/api/.env
    ports:
      # Host port defaults to 85; override with HOST_PORT=86 if you ever
      # need a second one running alongside it. Container-side stays on the
      # app's normal PORT (4000, from apps/api/.env) — no need to bind a
      # privileged port inside the container. Bound to 127.0.0.1 so only the
      # host's nginx can reach it — a bare "85:4000" publishes on every
      # interface, and Docker's iptables rules bypass ufw, so a firewall
      # alone wouldn't keep it private.
      - '127.0.0.1:${HOST_PORT:-85}:4000'
    # Inside the container 127.0.0.1 is the container itself — this makes
    # "host.docker.internal" resolve to the Docker host (automatic on Docker
    # Desktop, needed explicitly on Linux), e.g. for a MongoDB running there.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
    # Surfaces a stuck-but-still-running process in `docker ps`/`docker
    # inspect` (status: unhealthy) for monitoring. Note this alone does NOT
    # make `restart: unless-stopped` kick in — plain Compose only restarts
    # on container exit, not on a failing healthcheck. Actual self-recovery
    # from a dead chain connection comes from the app itself: repeated chain
    # query timeouts now call process.exit(1) (see
    # apps/api/src/chain/connectionHealth.ts), which IS a real exit and
    # does trigger this restart policy.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/api/health').then(r=>r.json()).then(j=>process.exit(j.status==='ok'?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
