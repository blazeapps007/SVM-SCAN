# ==========================================
# Virtual Host: svmscan.blazeapps.org
# ==========================================
# Reference nginx site config for the Dexplorer container. Copy this to
# /etc/nginx/sites-available/svmscan.blazeapps.org on the host, symlink it
# into sites-enabled, then `nginx -t && systemctl reload nginx`.
#
# Assumes the app is running via `docker compose up -d` from this repo with
# the default HOST_PORT (85) — see docker-compose.yml. If you ever run a
# second instance on 86, add a second server block below the same way.

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name svmscan.blazeapps.org;

    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name svmscan.blazeapps.org;

    # SSL certificates (same as autoblaze.xyz / db01.blazeapps.org)
    ssl_certificate /home/SSL-CERTS/autoblaze.xyz.cert;
    ssl_certificate_key /home/SSL-CERTS/autoblaze.xyz.key;

    # SSL protocols & ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy no-referrer-when-downgrade;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Include Cloudflare IPs for real client IP
    include /etc/nginx/cloudflare/cloudflare-ips.conf;

    # Logging
    access_log /var/log/nginx/svmscan.blazeapps.org-access.log;
    error_log /var/log/nginx/svmscan.blazeapps.org-error.log warn;

    # Proxy all traffic to the Dexplorer container (host port 85, see
    # docker-compose.yml's HOST_PORT default)
    location / {
        proxy_pass http://127.0.0.1:85/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}
