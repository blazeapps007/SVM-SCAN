                    createdAtHeight: '379191'
                    validatorConfirmations:
                      - validatorAddress: steemvaloper1u96tympny5r8m76psg5jr7fm8kcrg76wms5jgt
                        moniker: dhaka.witness
                        timestamp: '1786663267'
                pagination: { page: 0, perPage: 1, total: 1743 }

  /bridge-deposits/stats:
    get:
      tags: [Bridge Deposits]
      summary: Deposit counts by status
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeDepositStats'
