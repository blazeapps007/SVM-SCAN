  /denoms/{denom}:
    get:
      tags: [Denoms]
      operationId: getDenom
      summary: Get denom metadata
      description: 'Falls back to a heuristic guess (source: "fallback") for an unrecognized denom instead of 404ing.'
      parameters:
        - name: denom
          in: path
          required: true
          schema: { type: string }
          example: asteem
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DenomMetadataResponse'
              example: { denom: asteem, displayName: Steem, symbol: STEEM, decimals: 18, source: seed }

