openapi: 3.1.0
info:
  title: SVM Scan API
  version: '1.0'
  description: |
    **SVM Scan** is a read-only REST API that serves indexed data for the
    Steem Virtual Machine chain — a Cosmos SDK chain with an integrated EVM.
    It's the backend for [svmscan.blazeapps.org](https://svmscan.blazeapps.org),
    but is itself a public, unauthenticated API that anyone can call directly.

    A background indexer walks the chain block-by-block into MongoDB
    (backfill from genesis, then a live tail of new blocks), and this API
    serves that indexed data. A few endpoints are deliberate exceptions that
    proxy the chain (or an external LCD/EVM RPC) live instead of reading
    from the index — each one says so explicitly in its description below.

    ## Conventions

    - **Pagination**: every list endpoint returns the same envelope —
      `{ "data": [...], "pagination": { "page": 0, "perPage": 50, "total": 123 } }`.
      `page` is 0-indexed. Pass `?page=` and `?perPage=` as query strings;
      omitting them uses the endpoint's own default page size.
    - **Errors**: non-2xx responses are `{ "error": "human-readable message" }`.
    - **Timestamps**: always ISO-8601 UTC strings (e.g. `2026-08-12T00:32:29.334Z`).
    - **Big numbers as strings**: coin amounts, block heights used as ids,
      registration/deposit/withdrawal ids, and anything else that can exceed
      JavaScript's safe integer range is serialized as a **string**, not a
      JSON number. Only genuinely small integers (page numbers, counts,
      block heights used as heights) are real numbers.
    - **Denoms**: the chain's native token is `asteem` (18 decimals, symbol
      `STEEM`) — the EVM-side equivalent of the same token is also called
      STEEM. IBC denoms arrive as `ibc/<hash>`; use `GET /denoms/{denom}` or
      an account response's `resolvedDenoms` map to get the real symbol.
  contact:
    name: SVM Scan
    url: https://github.com/blazeapps007/SVM-SCAN
  license:
    name: GPL-2.0
    url: https://github.com/blazeapps007/SVM-SCAN/blob/main/LICENSE

servers:
  - url: https://svmscan.blazeapps.org/api
    description: Production
  - url: http://localhost:4000/api
    description: Local dev (pnpm dev:api)

# This API is entirely public and unauthenticated — declared explicitly so
# linters don't flag every operation as missing a security requirement.
security: []

tags:
  - name: Health
  - name: Network
  - name: Blocks
  - name: Transactions
  - name: Validators
  - name: Proposals
  - name: Accounts
  - name: IBC Transfers
  - name: Params
  - name: Denoms
  - name: EVM
  - name: Liquidity Pools
  - name: Bridge Deposits
    description: |
      The `steembridge` module's Steem → SVM deposit direction. A user sends
      STEEM to a gateway account on Steem with a memo tagging their SVM
      address; bonded validators (oracles) attest to the deposit, and once
      enough attestations land it's minted on-chain.
  - name: Bridge Withdrawals
    description: |
      The `steembridge` module's SVM → Steem direction ("bridge-out"). A
      user burns `asteem` via `MsgBridgeOut`, creating an immutable
      withdrawal record. There is currently no automated Steem-side payout —
      this is a queue for validators to relay manually.
  - name: Oracle
    description: |
      The `oracledata` module (`steemvm.oracle.data.v1`) — commit-reveal
      validator voting that produces power-weighted-median exchange rates for
      the pairs the `steembridge` module needs. **Not backed by MongoDB** —
      `/oracle/exchange-rates` proxies the LCD live, same as Name Service.
  - name: Name Service (SVMNS)
    description: |
      Steem Virtual Machine Name Service — links a Steem username to an SVM
      address through a registration lifecycle (pending → awaiting →
      active/superseded/expired). **Not backed by MongoDB** — every endpoint
      in this group proxies the chain's LCD REST API live (with a short
      server-side cache), because the underlying query surface has no way to
      enumerate "every name ever registered," only targeted lookups plus two
      status-filtered queues.

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: API and indexer health
      description: |
        Checks MongoDB and chain-RPC connectivity directly (not just "is the
        process up") and reports current indexer progress. This is what the
        frontend polls every 10s to decide whether to show the app or an
        "unreachable" screen — always returns HTTP 200, check `status` in
        the body, not the status code.
      responses:
        '200':
          description: OK (check `status` field — always HTTP 200 even when degraded)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                mongo: true
                chain: true
                indexerMode: live
                lastIndexedHeight: 382210

  /network/status:
    get:
      tags: [Network]
      operationId: getNetworkStatus
      summary: Live network status
      description: Proxies the chain's current sync status directly (not indexed) — chain id, head height, peer count, catching-up flag, average block interval.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkStatusResponse'
              example:
                chainId: steemvm
                blockHeight: 382211
                catchingUp: false
                peered: 3
                blockInterval: 6.7

  /blocks:
    get:
      tags: [Blocks]
      operationId: listBlocks
      summary: List blocks
      description: Newest first. Default page size 50.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BlockSummary'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'
              example:
                data:
                  - height: 382211
                    hash: 5552F75E87C8B5C6DFA8126DEEB097FF6CB03F1900156B0E80AE307F35AAA963
                    time: '2026-08-14T04:50:57.663Z'
                    proposerAddress: 56D6DF9A8F4DFA6DCF8CABB2F3C9DDE167C68372
                    appHash: B564B9FBDC6F58BECBE077E84E1B34C11D05245AED71F5CBC01D3C3B224018D5
                    txCount: 0
                pagination: { page: 0, perPage: 1, total: 382211 }

  /blocks/{height}:
    get:
      tags: [Blocks]
      operationId: getBlock
      summary: Get a block by height
      parameters:
        - $ref: '#/components/parameters/height'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockDetailResponse'
              example:
                height: 353345
                hash: 9588C1B80D7866742A563495D9791737C683B676B64EC79BAAAFA41A02913951
                time: '2026-08-12T00:32:29.334Z'
                proposerAddress: 64837863184C5B2C462593FCD5C366B0558C4EF4
                appHash: 34C979A8E10126D208206FA3A69613D69967752B52DE00622EDA0458C5507FFE
                txCount: 3
                txHashes:
                  - C05E4276B2B53C907E600335B67C3AD7F6A5BA028B87F841D7D65AB542DB5A0F
                  - EFFA7B8B3E862C666C68B487C00415472A849DEA8D03F60A0783DCCE7EBACF12
                  - 92F332E5091F9881BB60AAD23E52913534E641C2272AF7B9B7C732F384C9046C
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /blocks/{height}/transactions:
    get:
      tags: [Blocks]
      operationId: listBlockTransactions
      summary: List transactions in a block
      description: Unpaginated — returns every transaction in the block (block tx counts are always small).
      parameters:
        - $ref: '#/components/parameters/height'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionSummary'
        '400':
          $ref: '#/components/responses/BadRequest'

  /transactions:
    get:
      tags: [Transactions]
      operationId: listTransactions
      summary: List transactions
      description: Newest first. Default page size 50.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - name: type
          in: query
          description: Filter to transactions containing a message of this exact typeUrl (e.g. `/steemvm.oracle.data.v1.MsgAggregateExchangeRateVote`). See `GET /transactions/message-types` for the full set currently indexed.
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TransactionSummary'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'
              example:
                data:
                  - hash: 5CD1859FDC00DBB168787B42F47F2D39658D3F3812E7B831BE9E30933638CA03
                    height: 379199
                    timestamp: '2026-08-13T23:22:00.430Z'
                    code: 0
                    success: true
                    messageTypes: ['/steemvm.steembridge.v1.MsgAttestDeposit']
                    fee: []
                    gasUsed: '68580'
                    gasWanted: '600000'
                pagination: { page: 0, perPage: 1, total: 9064 }

  /transactions/message-types:
    get:
      tags: [Transactions]
      operationId: listTransactionMessageTypes
      summary: Every distinct message typeUrl currently indexed
      description: Powers the type filter dropdown on the transactions list — index-covered `distinct()` over `transactions.messageTypes`, sorted alphabetically.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
              example:
                - /cosmos.bank.v1beta1.MsgSend
                - /cosmos.staking.v1beta1.MsgDelegate
                - /steemvm.oracle.data.v1.MsgAggregateExchangeRatePrevote
                - /steemvm.oracle.data.v1.MsgAggregateExchangeRateVote
                - /steemvm.steembridge.v1.MsgAttestDeposit
                - /steemvm.steembridge.v1.MsgBridgeOut

  /transactions/{hash}:
    get:
      tags: [Transactions]
      operationId: getTransaction
      summary: Get a transaction by hash
      description: |
        Messages are decoded server-side (see `@dexplorer/shared`'s message
        registry) — a type this API doesn't have a named decoder for still
        decodes, just with generic `field_1`/`field_2`/... keys instead of
        real names. Five message types get extra enrichment merged into
        `data`: `MsgAttestDeposit`/`MsgSubmitNameRegistration`/
        `MsgAttestWithdrawalPayout`/`MsgAggregateExchangeRateVote`/
        `MsgAggregateExchangeRatePrevote` get an `oracleMoniker` (the
        attesting validator's moniker), and `MsgConfirmName` gets a
        `linkedSteemAccount`. `moduleAccounts` resolves any bech32 address in
        `events` to its Cosmos SDK module account name, where applicable.


        `{hash}` also accepts an EVM-format tx hash (`0x` + 64 hex chars —
        what MetaMask/an EVM wallet links to) for a `MsgEthereumTx`: it's
        resolved to the SVM tx that wraps it via the decoded inner hash, so
        the response's own `hash` field is still the outer Tendermint hash,
        not what was requested. If no such wrapper is indexed yet, this
        endpoint 404s even though the tx may still be visible via
        `GET /evm/tx/{hash}` directly (that endpoint queries the chain's EVM
        JSON-RPC live, independent of this indexer).
      parameters:
        - $ref: '#/components/parameters/hash'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetailResponse'
              example:
                hash: C05E4276B2B53C907E600335B67C3AD7F6A5BA028B87F841D7D65AB542DB5A0F
                height: 353345
                timestamp: '2026-08-12T00:32:29.334Z'
                code: 0
                success: true
                messageTypes: ['/steemvm.steembridge.v1.MsgAttestDeposit']
                fee: []
                gasUsed: '92488'
                gasWanted: '600000'
                log: ''
                memo: ''
                chainId: steemvm
                messages:
                  - typeUrl: /steemvm.steembridge.v1.MsgAttestDeposit
                    data:
                      validator: steem1u96tympny5r8m76psg5jr7fm8kcrg76w3rmpng
                      txid: 5da85737d515500e6cb23a02fd981263d8c7de7f
                      opIndex: 0
                      steemBlock: '108611220'
                      steemTimestamp: '2026-08-12T00:31:36'
                      steemSender: blaze.apps
                      gatewayAccount: svm.bank
                      amountMillisteem: '1000'
                      memo: svm-deposit 0x7fb5a561b74e7da7cd5fb1497830e96b3310d857
                      oracleMoniker: dhaka.witness
                events:
                  - type: deposit_created
                    attributes:
                      - { key: deposit_id, value: '1855' }
                      - { key: txid, value: 5da85737d515500e6cb23a02fd981263d8c7de7f }
                senders: ['steem1u96tympny5r8m76psg5jr7fm8kcrg76w3rmpng']
                ibcTransfer: null
                moduleAccounts:
                  steem10a2y3nc3kqn7cm2lhlkgfgt7du70rstwm0ul3x: steemblackhole
                  steem189zqgygvhf5j56st8698qa9nz6jjhu45d089kz: bridge_reward
                  steem17xpfvakm2amg962yls6f84z3kell8c5lxvg9x8: fee_collector
        '404':
          $ref: '#/components/responses/NotFound'

  /validators:
    get:
      tags: [Validators]
      operationId: listValidators
      summary: List validators
      description: Sorted by voting power (tokens) descending. Default page size 100.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - name: status
          in: query
          description: Pass `active` to only return bonded validators; omit for all (including jailed/unbonding).
          schema: { type: string, enum: [active] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ValidatorSummary'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'
              example:
                data:
                  - operatorAddress: steemvaloper1ghedj9xr90sp3xqx6sx4ey2p0wul684gealm26
                    moniker: steem-agora.evm
                    identity: ''
                    status: BOND_STATUS_UNBONDING
                    jailed: true
                    tokens: '9702990123456790123457'
                    bondDenom: asteem
                    commissionRate: '100000000000000000'
                    votingPowerPercent: 1.2008437313791251
                pagination: { page: 0, perPage: 1, total: 13 }

  /validators/stats:
    get:
      tags: [Validators]
      operationId: getValidatorStats
      summary: Validator set summary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidatorStats'
              example: { activeCount: 11, totalCount: 13, avgCommission: 10 }

  /validators/{identity}:
    get:
      tags: [Validators]
      operationId: getValidator
      summary: Get a validator
      description: The `identity` path segment matches against `identity` (Keybase), `moniker`, or `operatorAddress` — whichever hits first.
      parameters:
        - name: identity
          in: path
          required: true
          schema: { type: string }
          example: blaze.apps
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidatorDetailResponse'
              example:
                operatorAddress: steemvaloper103n2lmnkhpsjr8yajganm2x26pq9rsp30gpzv4
                moniker: blaze.apps
                identity: ''
                status: BOND_STATUS_BONDED
                jailed: false
                tokens: '792000000000000000000'
                bondDenom: asteem
                commissionRate: '100000000000000000'
                votingPowerPercent: 0.7559966341118406
                website: ''
                details: owner=STM59ytBUdJ1DaSeFoz4GP5nBFiVBF2dpEDN4cHcR4wYFxWvE2ctR;active=STM5fvPvqwkwDTKXW1wsr7wPdeVXjetjvg1Wer8Zs7P24KFHht2Be;posting=STM5nr8yJLekbns9BNtx8FUxZTvphtfuNKVkTqCXswAjM6GTrQtdX
                delegatorShares: '800000000000000000000.000000000000000000'
                minSelfDelegation: '1'
                unbondingHeight: '20159'
                consensusPubkey: '{"typeUrl":"/cosmos.crypto.ed25519.PubKey","value":"MH24df+F3VnXpX0LquscMfOdFwJIPOTgCosxpDk0Hy8="}'
                uptime: { missedBlocksCounter: '0', signedBlocksWindow: '100' }
                pendingRewards: [{ denom: asteem, amount: '6357304896302555505.419127201143333997' }]
                accumulatedCommission: [{ denom: asteem, amount: '635730489630255550.541912720114333372' }]
        '404':
          $ref: '#/components/responses/NotFound'

  /proposals:
    get:
      tags: [Proposals]
      operationId: listProposals
      summary: List governance proposals
      description: Newest first. Default page size 10.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProposalSummary'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'
              example:
                data:
                  - id: 1
                    title: Set EVM min gas price to 0.0001 STEEM/gas
                    status: PROPOSAL_STATUS_VOTING_PERIOD
                    votingStartTime: '2026-08-21T10:12:43.401Z'
                    votingEndTime: '2026-08-23T10:12:43.401Z'
                    submitTime: '2026-08-21T10:12:43.401Z'
                pagination: { page: 0, perPage: 1, total: 7 }

  /proposals/stats:
    get:
      tags: [Proposals]
      operationId: getProposalStats
      summary: Proposal counts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalStats'
              example: { total: 7, activeVoting: 0, passed: 3 }

  /proposals/{id}:
    get:
      tags: [Proposals]
      operationId: getProposal
      summary: Get a proposal
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          example: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalDetailResponse'
              example:
                id: 1
                title: Set EVM min gas price to 0.0001 STEEM/gas
                status: PROPOSAL_STATUS_VOTING_PERIOD
                votingStartTime: '2026-08-21T10:12:43.401Z'
                votingEndTime: '2026-08-23T10:12:43.401Z'
                submitTime: '2026-08-21T10:12:43.401Z'
                summary: Floors the EVM feemarket base fee at 100000000000000 asteem (0.0001 STEEM) per gas unit.
                proposer: steem1am0j95eum7tezy8n9fwjrj0nldkwaskg9xphh8
                depositEndTime: '2026-08-23T10:12:43.401Z'
                totalDeposit:
                  - { denom: asteem, amount: '10000000' }
                finalTallyResult:
                  yesCount: '100000000000000000000000'
                  noCount: '0'
                  abstainCount: '0'
                  noWithVetoCount: '0'
                expedited: false
                failedReason: ''
                messages:
                  - typeUrl: /cosmos.evm.feemarket.v1.MsgUpdateParams
                    data:
                      authority: steem10d07y265gmmuvt4z0w9aw880jnsr700jvhcqmf
                      params:
                        noBaseFee: false
                        baseFeeChangeDenominator: 8
                        elasticityMultiplier: 2
                        enableHeight: '0'
                        baseFee: '7.000000000000000000'
                        minGasPrice: '100000000000000.000000000000000000'
                        minGasMultiplier: '0.500000000000000000'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /accounts/recent:
    get:
      tags: [Accounts]
      operationId: listRecentAccounts
      summary: Recently active accounts
      description: Derived from the last 200 indexed transactions' senders, not a dedicated collection.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 10, maximum: 50 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecentAccount'
              example:
                - address: steem1eldczteraanqjcp34wfwejavunsuavejaxv29q
                  lastMessageType: /steemvm.steembridge.v1.MsgAttestDeposit
                  lastActivityTime: '2026-08-13T23:22:00.430Z'

  /accounts/{address}:
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: Get account balances and info
      description: |
        **Deliberate exception to the rest of this API**: balances and
        sequence are fetched live from the chain (not pre-indexed), since
        indexing balances for every address ever seen is out of scope.
        Cached server-side for 15s per address. `ibc/<hash>` balances are
        resolved to their real symbol/decimals in `resolvedDenoms`.
      parameters:
        - $ref: '#/components/parameters/address'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetailResponse'
              example:
                address: steem107662cdhfe760n2lk9yhsv8fdve3pkzhlmtsvu
                accountNumber: '0'
                sequence: '0'
                balances:
                  - { denom: asteem, amount: '3000000000000000' }
                  - { denom: 'ibc/47BD209179859CDE4A2806763D7189B6E6FE13A17880FE2B42DE1E6C1E329E23', amount: '40000000' }
                stakedBalance: { amount: '557282717890820016844659', denom: asteem }
                validator:
                  operatorAddress: steemvaloper107662cdhfe760n2lk9yhsv8fdve3pkzh4gyrhl
                  moniker: blaze.apps
                  identity: ''
                resolvedDenoms:
                  asteem: { baseDenom: asteem, symbol: STEEM, decimals: 18, path: null }
                  'ibc/47BD209179859CDE4A2806763D7189B6E6FE13A17880FE2B42DE1E6C1E329E23':
                    { baseDenom: uosmo, symbol: OSMO, decimals: 6, path: transfer/channel-3 }

  /accounts/{address}/transactions:
    get:
      tags: [Accounts]
      operationId: listAccountTransactions
      summary: List an account's transactions
      description: Served from the `transactions` collection's indexed `senders` field. Default page size 10.
      parameters:
        - $ref: '#/components/parameters/address'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TransactionSummary'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'
              example:
                data:
                  - hash: 4CB232020C12F0394B364BF44CF5D3171C24DA7D557A2501272B4B8B197C6F01
                    height: 379192
                    timestamp: '2026-08-13T23:21:14.631Z'
                    code: 0
                    success: true
                    messageTypes: ['/steemvm.steembridge.v1.MsgAttestDeposit']
                    fee: []
                    gasUsed: '94216'
                    gasWanted: '600000'
                pagination: { page: 0, perPage: 1, total: 1292 }

  /ibc-transfers:
    get:
      tags: [IBC Transfers]
      operationId: listIbcTransfers
      summary: List IBC transfers
      description: Every indexed transaction whose events matched an IBC packet-transfer pattern. Newest first. Default page size 100.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/IBCTransferSummary'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'
              example:
                data:
