components:
  parameters:
    page:
      name: page
      in: query
      description: 0-indexed page number.
      schema: { type: integer, default: 0, minimum: 0 }
    perPage:
      name: perPage
      in: query
      description: Items per page (endpoint-specific default and max).
      schema: { type: integer, minimum: 1, maximum: 200 }
    height:
      name: height
      in: path
      required: true
      schema: { type: integer }
      example: 353345
    hash:
      name: hash
      in: path
      required: true
      description: Cosmos transaction hash, case-insensitive.
      schema: { type: string }
      example: C05E4276B2B53C907E600335B67C3AD7F6A5BA028B87F841D7D65AB542DB5A0F
    address:
      name: address
      in: path
      required: true
      description: bech32 account address.
      schema: { type: string }
      example: steem107662cdhfe760n2lk9yhsv8fdve3pkzhlmtsvu

  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: 'Not found' }
    BadRequest:
      description: Invalid parameter
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: 'Invalid block height' }
    NameServiceUnavailable:
      description: STEEMBRIDGE_LCD_URL isn't configured on this deployment
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: 'Name service unavailable' }

  schemas:
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
      required: [error]

    PaginationMeta:
      type: object
      properties:
        page: { type: integer }
        perPage: { type: integer }
        total: { type: integer }
      required: [page, perPage, total]

    Coin:
      type: object
      properties:
        denom: { type: string }
        amount: { type: string }
      required: [denom, amount]

    HealthResponse:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded] }
        mongo: { type: boolean }
        chain: { type: boolean }
        indexerMode: { type: string, enum: [backfill, live] }
        lastIndexedHeight: { type: integer }
      required: [status, mongo, chain, indexerMode, lastIndexedHeight]

    NetworkStatusResponse:
      type: object
      properties:
        chainId: { type: string }
        blockHeight: { type: integer }
        catchingUp: { type: boolean }
        peered: { type: integer }
        blockInterval: { type: number, description: Average seconds between blocks. }
      required: [chainId, blockHeight, catchingUp, peered, blockInterval]

    BlockSummary:
      type: object
      properties:
        height: { type: integer }
        hash: { type: string }
        time: { type: string, format: date-time }
        proposerAddress: { type: string }
        appHash: { type: string }
        txCount: { type: integer }
      required: [height, hash, time, proposerAddress, appHash, txCount]

    BlockDetailResponse:
      allOf:
        - $ref: '#/components/schemas/BlockSummary'
        - type: object
          properties:
            txHashes:
              type: array
              items: { type: string }
          required: [txHashes]

    TransactionSummary:
      type: object
      properties:
        hash: { type: string }
        height: { type: integer }
        timestamp: { type: string, format: date-time }
        code: { type: integer, description: 0 means success. }
        success: { type: boolean }
        messageTypes:
          type: array
          items: { type: string }
        fee:
          type: array
          items: { $ref: '#/components/schemas/Coin' }
        gasUsed: { type: string }
        gasWanted: { type: string }
      required: [hash, height, timestamp, code, success, messageTypes, fee, gasUsed, gasWanted]

    DecodeMsg:
      type: object
      description: A decoded Cosmos SDK message. `data`'s shape depends on `typeUrl` — see the message-type registry in `packages/shared/src/encoding/msg.ts`.
      properties:
        typeUrl: { type: string }
        data:
          type: [object, 'null']
          additionalProperties: true
      required: [typeUrl, data]

    EventAttribute:
      type: object
      properties:
        key: { type: string }
        value: { type: string }
        index: { type: boolean }
      required: [key, value]

    TxEvent:
      type: object
      properties:
        type: { type: string }
        attributes:
          type: array
          items: { $ref: '#/components/schemas/EventAttribute' }
      required: [type, attributes]

    IBCTransferFields:
      type: object
      properties:
        sender: { type: string }
        receiver: { type: string }
        sourceChannel: { type: string }
        sourcePort: { type: string }
        destinationChannel: { type: string }
        destinationPort: { type: string }
        amount: { type: string }
        denom: { type: string }
        memo: { type: string }
      required: [sender, receiver, sourceChannel, sourcePort, destinationChannel, destinationPort, amount, denom, memo]

    TransactionDetailResponse:
      allOf:
        - $ref: '#/components/schemas/TransactionSummary'
        - type: object
          properties:
            log: { type: string }
            memo: { type: string }
            chainId: { type: string }
            messages:
              type: array
              items: { $ref: '#/components/schemas/DecodeMsg' }
            events:
              type: array
              items: { $ref: '#/components/schemas/TxEvent' }
            senders:
              type: array
              items: { type: string }
            ibcTransfer:
              oneOf:
                - $ref: '#/components/schemas/IBCTransferFields'
                - type: 'null'
            moduleAccounts:
              type: object
              additionalProperties: { type: string }
              description: bech32 address -> Cosmos SDK module account name (e.g. "fee_collector", "bridge_reward", "steemblackhole"), for labeling module accounts that show up as a sender/receiver in `events`. Empty when STEEMBRIDGE_LCD_URL isn't configured.
          required: [log, memo, chainId, messages, events, senders, ibcTransfer, moduleAccounts]

    ValidatorSummary:
      type: object
      properties:
        operatorAddress: { type: string }
        moniker: { type: string }
        identity: { type: string }
        status: { type: string }
        jailed: { type: boolean }
        tokens: { type: string }
        bondDenom: { type: string }
        commissionRate: { type: string }
        votingPowerPercent: { type: number }
      required: [operatorAddress, moniker, identity, status, jailed, tokens, bondDenom, commissionRate, votingPowerPercent]

    ValidatorUptime:
      type: object
      properties:
        missedBlocksCounter: { type: string }
        signedBlocksWindow: { type: string }
      required: [missedBlocksCounter, signedBlocksWindow]

    ValidatorDetailResponse:
      allOf:
        - $ref: '#/components/schemas/ValidatorSummary'
        - type: object
          properties:
            website: { type: string }
            details: { type: string }
            delegatorShares: { type: string, description: 'Human-decimal atto-denominated amount (18 fractional digits), e.g. "161500000000000000000000.000000000000000000" — already decoded from the raw LegacyDec wire encoding, so it needs only the standard atto->STEEM conversion like `tokens`, not a second Dec-decode step.' }
            minSelfDelegation: { type: string }
            unbondingHeight: { type: string }
            consensusPubkey:
              oneOf: [{ type: string }, { type: 'null' }]
            uptime:
              oneOf:
                - $ref: '#/components/schemas/ValidatorUptime'
                - type: 'null'
            pendingRewards:
              description: 'Live (not indexed — accrues every block) un-withdrawn rewards, split between delegators and the validator''s own commission cut. Amounts are already Dec-decoded but still atto-denominated, same convention as delegatorShares. null if the live distribution-module query failed.'
              oneOf:
                - type: array
                  items: { $ref: '#/components/schemas/Coin' }
                - type: 'null'
            accumulatedCommission:
              description: "The validator's own cut of pendingRewards (what it would receive on withdrawal) — a subset of pendingRewards, not additional to it. Same null-on-failure convention."
              oneOf:
                - type: array
                  items: { $ref: '#/components/schemas/Coin' }
                - type: 'null'
          required: [website, details, delegatorShares, minSelfDelegation, unbondingHeight, consensusPubkey, uptime, pendingRewards, accumulatedCommission]

    ValidatorStats:
      type: object
      properties:
        activeCount: { type: integer }
        totalCount: { type: integer }
        avgCommission: { type: number }
      required: [activeCount, totalCount, avgCommission]

    ProposalSummary:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        status: { type: string }
        votingStartTime: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        votingEndTime: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        submitTime: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
      required: [id, title, status, votingStartTime, votingEndTime, submitTime]

    ProposalDetailResponse:
      allOf:
        - $ref: '#/components/schemas/ProposalSummary'
        - type: object
          properties:
            summary: { type: string }
            proposer: { type: string }
            depositEndTime: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
            totalDeposit:
              type: array
              items: { $ref: '#/components/schemas/Coin' }
            finalTallyResult:
              oneOf:
                - type: object
                  properties:
                    yesCount: { type: string }
                    noCount: { type: string }
                    abstainCount: { type: string }
                    noWithVetoCount: { type: string }
                  required: [yesCount, noCount, abstainCount, noWithVetoCount]
                - type: 'null'
            messages:
              type: array
              items: { $ref: '#/components/schemas/DecodeMsg' }
            expedited: { type: boolean, description: Gov v1's expedited-proposal path (shorter voting period, higher pass threshold). }
            failedReason: { type: string, description: 'Set only if status is PROPOSAL_STATUS_FAILED (passed, but its messages then failed to execute on-chain); empty string otherwise, including for PROPOSAL_STATUS_REJECTED.' }
          required: [summary, proposer, depositEndTime, totalDeposit, finalTallyResult, messages, expedited, failedReason]

    ProposalStats:
      type: object
      properties:
        total: { type: integer }
        activeVoting: { type: integer }
        passed: { type: integer }
      required: [total, activeVoting, passed]

    AccountValidatorLink:
      type: object
      properties:
        operatorAddress: { type: string }
        moniker: { type: string }
        identity: { type: string }
      required: [operatorAddress, moniker, identity]

    ResolvedDenom:
      type: object
      properties:
        baseDenom: { type: string }
        symbol: { type: string }
        decimals: { type: integer }
        path: { oneOf: [{ type: string }, { type: 'null' }] }
      required: [baseDenom, symbol, decimals, path]

    AccountDetailResponse:
      type: object
      properties:
        address: { type: string }
        accountNumber: { type: string }
        sequence: { type: string }
        balances:
          type: array
          items: { $ref: '#/components/schemas/Coin' }
        stakedBalance:
          oneOf:
            - $ref: '#/components/schemas/Coin'
            - type: 'null'
        validator:
          oneOf:
            - $ref: '#/components/schemas/AccountValidatorLink'
            - type: 'null'
        resolvedDenoms:
          type: object
          additionalProperties: { $ref: '#/components/schemas/ResolvedDenom' }
      required: [address, accountNumber, sequence, balances, stakedBalance, validator, resolvedDenoms]

    RecentAccount:
      type: object
      properties:
        address: { type: string }
        lastMessageType: { type: string }
        lastActivityTime: { type: string, format: date-time }
      required: [address, lastMessageType, lastActivityTime]

    IBCTransferSummary:
      allOf:
        - $ref: '#/components/schemas/IBCTransferFields'
        - type: object
          properties:
            hash: { type: string }
            height: { type: integer }
            timestamp: { type: string, format: date-time }
            status: { type: string, enum: [success, failed] }
          required: [hash, height, timestamp, status]

    EvmTokenTransfer:
      type: object
      properties:
        type: { type: string, enum: [token_transfer, token_minting] }
        from: { type: string }
        to: { type: string }
        tokenAddress: { type: string }
        tokenName: { oneOf: [{ type: string }, { type: 'null' }] }
        tokenSymbol: { oneOf: [{ type: string }, { type: 'null' }] }
        tokenDecimals: { oneOf: [{ type: string }, { type: 'null' }] }
        amount: { oneOf: [{ type: string }, { type: 'null' }] }
      required: [type, from, to, tokenAddress, tokenName, tokenSymbol, tokenDecimals, amount]

    EvmTransactionDetails:
      type: object
      properties:
        hash: { type: string }
        status: { type: string, enum: [ok, error] }
        method: { oneOf: [{ type: string }, { type: 'null' }], description: A best-effort label for known selectors (e.g. ERC-20 transfer); null for a plain value transfer or an unrecognized selector. }
        from: { type: string }
        to: { oneOf: [{ type: string }, { type: 'null' }] }
        toIsContract: { type: boolean }
        value: { type: string, description: 'Native asteem transferred, 18 decimals.' }
        gasUsed: { type: string }
        gasPrice: { type: string, description: 'Wei-per-gas actually charged (the receipt''s effectiveGasPrice). The wrapping Cosmos tx''s own `fee` is always empty for a MsgEthereumTx on this chain, so this (and `fee` below) is the only place the real cost is observable.' }
        fee: { type: string, description: 'gasUsed * gasPrice, in the native 18-decimal asteem base unit — the actual amount deducted from `from` for this transaction.' }
        tokenTransfers:
          type: array
          items: { $ref: '#/components/schemas/EvmTokenTransfer' }
        explorerUrl: { oneOf: [{ type: string }, { type: 'null' }] }
      required: [hash, status, method, from, to, toIsContract, value, gasUsed, gasPrice, fee, tokenTransfers, explorerUrl]

    AddressTokenHolding:
      type: object
      properties:
        tokenAddress: { type: string }
        tokenType: { type: string }
        name: { oneOf: [{ type: string }, { type: 'null' }] }
        symbol: { oneOf: [{ type: string }, { type: 'null' }] }
        decimals: { oneOf: [{ type: string }, { type: 'null' }] }
        value: { type: string }
      required: [tokenAddress, tokenType, name, symbol, decimals, value]

    LiquidityPoolTokenInfo:
      type: object
      properties:
        address: { type: string }
        name: { oneOf: [{ type: string }, { type: 'null' }] }
        symbol: { oneOf: [{ type: string }, { type: 'null' }] }
        decimals: { oneOf: [{ type: string }, { type: 'null' }] }
      required: [address, name, symbol, decimals]

    LiquidityPoolSummary:
      type: object
      properties:
        poolAddress: { type: string }
        factoryAddress: { type: string }
        token0: { $ref: '#/components/schemas/LiquidityPoolTokenInfo' }
        token1: { $ref: '#/components/schemas/LiquidityPoolTokenInfo' }
        fee: { type: string, description: 'Hundredths of a basis point, e.g. "2500" = 0.25%.' }
        tickSpacing: { type: string }
        createdAtHeight: { type: integer }
        createdAtTxHash: { type: string }
        createdAt: { type: string, format: date-time }
      required: [poolAddress, factoryAddress, token0, token1, fee, tickSpacing, createdAtHeight, createdAtTxHash, createdAt]

    BridgeValidatorConfirmation:
      type: object
      properties:
        validatorAddress: { type: string }
        moniker: { oneOf: [{ type: string }, { type: 'null' }] }
        timestamp: { type: string, description: Unix seconds. }
      required: [validatorAddress, moniker, timestamp]

    BridgeDeposit:
      type: object
      properties:
        id: { type: string }
        txid: { type: string, description: Steem transaction id. }
        opIndex: { type: integer }
        steemBlock: { type: string }
        steemTimestamp: { type: string, format: date-time }
        steemSender: { type: string }
        gatewayAccount: { type: string }
        amountMillisteem: { type: string }
        memo: { type: string }
        derivedDestination: { type: string }
        destinationType: { type: string, enum: [DESTINATION_TYPE_NONE, DESTINATION_TYPE_COSMOS, DESTINATION_TYPE_EVM] }
        status: { type: string, enum: [DEPOSIT_STATUS_PENDING, DEPOSIT_STATUS_MINTED, DEPOSIT_STATUS_UNCLAIMABLE] }
        minted: { type: boolean }
        mintedAt: { type: string, description: 'SVM block height, "0" if not yet minted.' }
        mintTxHash: { type: string }
        createdAtHeight: { type: string }
        validatorConfirmations:
          type: array
          items: { $ref: '#/components/schemas/BridgeValidatorConfirmation' }
        asset: { type: string, enum: [BRIDGE_ASSET_STEEM, BRIDGE_ASSET_SBD], description: Both values are live on this chain — mints `asteem` or `asbd` respectively, both at 18 decimals under the same `amountMillisteem` numeric convention. Never assume STEEM; always read this field for the display unit. }
      required: [id, txid, opIndex, steemBlock, steemTimestamp, steemSender, gatewayAccount, amountMillisteem, memo, derivedDestination, destinationType, status, minted, mintedAt, mintTxHash, createdAtHeight, validatorConfirmations, asset]

    BridgeAssetTotal:
      type: object
      properties:
        asset: { type: string, enum: [BRIDGE_ASSET_STEEM, BRIDGE_ASSET_SBD] }
        amountMillisteem: { type: string, description: 3-decimal convention, same as BridgeDeposit/BridgeWithdrawal's amountMillisteem. }
      required: [asset, amountMillisteem]

    BridgeAssetCount:
      type: object
      properties:
        asset: { type: string, enum: [BRIDGE_ASSET_STEEM, BRIDGE_ASSET_SBD] }
        count: { type: integer }
      required: [asset, count]

    BridgeDepositStats:
      type: object
      properties:
        pending: { type: integer }
        minted: { type: integer }
        unclaimable: { type: integer }
        total: { type: integer, description: Count of deposits indexed as `bridgeDeposits` docs — does not include SVMNS name-registration mints. }
        countByAsset:
          type: array
          items: { $ref: '#/components/schemas/BridgeAssetCount' }
          description: Count of deposits (any status), grouped by asset.
        mintedByAsset:
          type: array
          items: { $ref: '#/components/schemas/BridgeAssetTotal' }
          description: Sum of amountMillisteem across MINTED deposits, grouped by asset — computed from our own indexed data, not a chain LCD call. Excludes SVMNS name-registration mints.
      required: [pending, minted, unclaimable, total, countByAsset, mintedByAsset]

    BridgeWithdrawal:
      type: object
      properties:
        id: { type: string }
        sender: { type: string, description: SVM account that burned the tokens. }
        destinationSteemAccount: { type: string }
        amountAsteem: { type: string, description: 18 decimals. }
        amountMillisteem: { type: string, description: Convenience 3-decimal duplicate of amountAsteem. }
        memo: { type: string }
        burnTxHash: { type: string, description: 'SVM chain tx hash (indexed — links to GET /transactions/{hash}).' }
        status: { type: string, enum: [WITHDRAWAL_STATUS_REQUESTED, WITHDRAWAL_STATUS_PROCESSED, WITHDRAWAL_STATUS_REFUNDED] }
        createdAtHeight: { type: string }
        asset: { type: string, enum: [BRIDGE_ASSET_STEEM, BRIDGE_ASSET_SBD], description: Both values are live on this chain — see BridgeDeposit's `asset` description. }
        feeMillisteem: { type: string, description: Protocol fee withheld from the withdrawal, sent to the bridge_reward module account. }
        steemPayoutTxid: { type: string, description: 'The Steem-side payout transaction id, set once status is PROCESSED. Empty string until then.' }
        payoutOpIndex: { type: integer }
        processedAtHeight: { type: string, description: 'SVM block height the withdrawal was marked PROCESSED at; "0" until then.' }
        refundedAtHeight: { type: string, description: 'SVM block height an unconfirmed withdrawal auto-refunded at past the timeout, without ever being attested; "0" unless that happened.' }
        validatorConfirmations:
          type: array
          items: { $ref: '#/components/schemas/BridgeValidatorConfirmation' }
      required: [id, sender, destinationSteemAccount, amountAsteem, amountMillisteem, memo, burnTxHash, status, createdAtHeight, asset, feeMillisteem, steemPayoutTxid, payoutOpIndex, processedAtHeight, refundedAtHeight, validatorConfirmations]

    BridgeWithdrawalStats:
      type: object
      properties:
        total: { type: integer }
        requested: { type: integer }
        processed: { type: integer }
        withdrawnByAsset:
          type: array
          items: { $ref: '#/components/schemas/BridgeAssetTotal' }
          description: Sum of amountMillisteem across every indexed withdrawal, grouped by asset — computed from our own indexed data, not a chain LCD call. Not status-filtered.
      required: [total, requested, processed, withdrawnByAsset]

    NameRecord:
      type: object
      properties:
        steemAccount: { type: string }
        address: { type: string }
        registrationId: { type: string }
        linkedAt: { type: string, description: SVM block height. }
      required: [steemAccount, address, registrationId, linkedAt]

    NameRegistration:
      type: object
      properties:
        id: { type: string }
        txid: { type: string }
        opIndex: { type: integer }
        steemBlock: { type: string }
        steemTimestamp: { type: string, description: 'ISO-8601 UTC, or the literal "genesis" for a genesis-seeded registration.' }
        steemAccount: { type: string }
        gatewayAccount: { type: string }
        amountMillisteem: { type: string, description: 'STEEM sent alongside the registration request — minted to `derivedDestination` on confirmation, same mechanism as a bridge deposit. Not a fee; nothing is withheld.' }
        memo: { type: string }
        derivedDestination: { type: string }
        destinationType: { type: string, enum: [DESTINATION_TYPE_NONE, DESTINATION_TYPE_COSMOS, DESTINATION_TYPE_EVM] }
        status: { type: string, description: 'One of NAME_REGISTRATION_STATUS_{PENDING,AWAITING,ACTIVE,SUPERSEDED,EXPIRED}.' }
        createdAtHeight: { type: string }
        awaitingSinceHeight: { type: string }
        confirmedAtHeight: { type: string }
        confirmTxHash: { type: string }
        validatorConfirmations:
          type: array
          items: { $ref: '#/components/schemas/BridgeValidatorConfirmation' }
      required: [id, txid, opIndex, steemBlock, steemTimestamp, steemAccount, gatewayAccount, amountMillisteem, memo, derivedDestination, destinationType, status, createdAtHeight, awaitingSinceHeight, confirmedAtHeight, confirmTxHash, validatorConfirmations]

    ChainParamsResponse:
      type: object
      properties:
        staking: { type: [object, 'null'], additionalProperties: true }
        mint: { type: [object, 'null'], additionalProperties: true }
        distribution: { type: [object, 'null'], additionalProperties: true }
        slashing: { type: [object, 'null'], additionalProperties: true }
        gov:
          type: object
          properties:
            votingParams: { type: [object, 'null'], additionalProperties: true }
            depositParams: { type: [object, 'null'], additionalProperties: true }
            tallyParams: { type: [object, 'null'], additionalProperties: true }
        bridge:
          oneOf:
            - $ref: '#/components/schemas/BridgeParams'
            - type: 'null'
        oracle:
          oneOf:
            - $ref: '#/components/schemas/OracleParams'
            - type: 'null'
      required: [staking, mint, distribution, slashing, gov, bridge, oracle]

    BridgeParams:
      type: object
      description: The `steembridge` module's own Params query (over LCD, not ABCI) — `null` when `STEEMBRIDGE_LCD_URL` isn't configured.
      properties:
        bridgeEnabled: { type: boolean }
        bridgeOutEnabled: { type: boolean }
        gatewayAccount: { type: string, description: 'Display-only — the real gateway account is a hardcoded chain constant ("svm.bank"), not governance-configurable via this field.' }
        bridgeConfirmationThreshold: { type: string, description: Decimal string (0-1) — share of bonded power required before a deposit mints. }
        minimumBridgeAmount: { type: string, description: 'asteem, 18 decimals. "0" means no minimum.' }
        maximumBridgeAmount: { type: string, description: 'asteem, 18 decimals. "0" means no maximum.' }
        depositTimeoutBlocks: { type: string }
        nameServiceEnabled: { type: boolean }
        nameRegistrationMinMillisteem: { type: string }
        namePendingTimeoutBlocks: { type: string }
        relayerStartBlock: { type: string }
        bridgeFeeBps: { type: integer, description: Fee in basis points (25 = 0.25%). }
        withdrawalTimeoutBlocks: { type: string, description: Blocks a withdrawal can stay REQUESTED before it auto-refunds on-chain without ever being attested as paid. }
      required: [bridgeEnabled, bridgeOutEnabled, gatewayAccount, bridgeConfirmationThreshold, minimumBridgeAmount, maximumBridgeAmount, depositTimeoutBlocks, nameServiceEnabled, nameRegistrationMinMillisteem, namePendingTimeoutBlocks, relayerStartBlock, bridgeFeeBps, withdrawalTimeoutBlocks]

    OracleParams:
      type: object
      description: The `oracledata` module's Params query (over LCD) — `null` when `STEEMBRIDGE_LCD_URL` isn't configured.
      properties:
        votePeriod: { type: string, description: Blocks between each price-feed aggregation round. }
        voteThreshold: { type: string, description: Decimal string (0-1) — share of bonded power required to finalize a rate. }
        rewardBand: { type: string, description: Decimal string — tolerance around the median vote that still earns a reward. }
        missBand: { type: string, description: Decimal string — tolerance around the median vote before a validator is marked as missing. }
        whitelist:
          type: array
          items: { type: string }
          description: Whitelisted price pairs, e.g. STEEM/USD_External.
      required: [votePeriod, voteThreshold, rewardBand, missBand, whitelist]

    ExchangeRate:
      type: object
      properties:
        pair: { type: string }
        rate: { type: string, description: Power-weighted-median rate, as a decimal string. }
        updateEpoch: { type: string, description: Internal aggregation round counter, not a wall-clock value. }
        updateTime: { type: string, description: Unix seconds. }
      required: [pair, rate, updateEpoch, updateTime]

    DenomMetadataResponse:
      type: object
      properties:
        denom: { type: string }
        displayName: { type: string }
        symbol: { type: string }
        decimals: { type: integer }
        source: { type: string, enum: [seed, manual, fallback] }
      required: [denom, displayName, symbol, decimals, source]
