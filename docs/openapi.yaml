  /params:
    get:
      tags: [Params]
      operationId: getParams
      summary: Chain module parameters
      description: |
        Aggregate of staking/mint/distribution/slashing/gov params (queried via ABCI, refreshed periodically) plus `bridge`/`oracle` params (queried over LCD from the chain's custom `steembridge`/`oracledata` modules — `null` when `STEEMBRIDGE_LCD_URL` isn't configured).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChainParamsResponse'
              example:
                staking: { unbondingTime: { seconds: 2419200, nanos: 0 }, maxValidators: 100, bondDenom: asteem }
                mint: { mintDenom: asteem, blocksPerYear: 5259600 }
                distribution: { communityTax: '500000000000000000', withdrawAddrEnabled: true }
                slashing: { signedBlocksWindow: 100, downtimeJailDuration: { seconds: 600, nanos: 0 } }
                gov:
                  votingParams: { votingPeriod: { seconds: 172800, nanos: 0 } }
                  depositParams: { minDeposit: [{ denom: asteem, amount: '10000000000000000000' }] }
                  tallyParams: { quorum: '0.334000000000000000', threshold: '0.500000000000000000' }
                bridge:
                  bridgeEnabled: true
                  bridgeOutEnabled: true
                  gatewayAccount: svm.bank
                  bridgeConfirmationThreshold: '0.666666666666666667'
                  minimumBridgeAmount: '0'
                  maximumBridgeAmount: '0'
                  depositTimeoutBlocks: '50400'
                  nameServiceEnabled: true
                  nameRegistrationMinMillisteem: '1'
                  namePendingTimeoutBlocks: '50400'
                  relayerStartBlock: '0'
                  bridgeFeeBps: 25
                  withdrawalTimeoutBlocks: '50400'
                oracle:
                  votePeriod: '600'
                  voteThreshold: '0.500000000000000000'
                  rewardBand: '0.020000000000000000'
                  missBand: '0.030000000000000000'
                  whitelist: [STEEM/USD_External, STEEM/SBD_Internal, SBD/USD_External, Price_Feed]

  /oracle/exchange-rates:
    get:
      tags: [Oracle]
      operationId: listOracleExchangeRates
      summary: Current finalized exchange rate for every whitelisted pair
      description: Live LCD proxy (30s cache), not indexed — rates only change once per oracle vote period.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExchangeRate'
              example:
                - pair: Price_Feed
                  rate: '0.104502035447605955'
                  updateEpoch: '4'
                  updateTime: '1787225133'
                - pair: SBD/USD_External
                  rate: '0.367276276618312100'
                  updateEpoch: '4'
                  updateTime: '1787225133'
                - pair: STEEM/SBD_Internal
                  rate: '0.093000000000000000'
                  updateEpoch: '4'
                  updateTime: '1787225133'
                - pair: STEEM/USD_External
                  rate: '0.037165851221533240'
                  updateEpoch: '4'
                  updateTime: '1787225133'
        '503':
          description: STEEMBRIDGE_LCD_URL isn't configured on this deployment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: 'Oracle data unavailable' }

  /denoms:
    get:
      tags: [Denoms]
      operationId: listDenoms
      summary: List known denom metadata
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DenomMetadataResponse'
              example:
                - { denom: asteem, displayName: Steem, symbol: STEEM, decimals: 18, source: seed }
