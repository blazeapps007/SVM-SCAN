      parameters:
        - name: idOrBurnTxHash
          in: path
          required: true
          schema: { type: string }
          example: '2'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeWithdrawal'
              example:
                id: '2'
                sender: steem107662cdhfe760n2lk9yhsv8fdve3pkzhlmtsvu
                destinationSteemAccount: blaze.apps
                amountAsteem: '1000000000000000000000'
                amountMillisteem: '1000000'
                memo: Bridge out to Steem
                burnTxHash: 2bedd554ae62c4c8c21d5530f006f28f6703581afe33f5d2f5f0607398c4c003
                status: WITHDRAWAL_STATUS_REQUESTED
                createdAtHeight: '173386'
        '404':
          $ref: '#/components/responses/NotFound'

  /name-service/resolve/{steemAccount}:
    get:
      tags: [Name Service (SVMNS)]
      summary: Resolve a Steem username to its currently linked address
      parameters:
        - name: steemAccount
          in: path
          required: true
          schema: { type: string }
          example: blaze.apps
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NameRecord'
              example:
                steemAccount: blaze.apps
                address: steem107662cdhfe760n2lk9yhsv8fdve3pkzhlmtsvu
                registrationId: '7'
                linkedAt: '23907'
        '404':
          description: No active name link for this account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: 'Name not found' }
        '503':
          $ref: '#/components/responses/NameServiceUnavailable'

  /name-service/by-address/{address}:
    get:
      tags: [Name Service (SVMNS)]
      summary: Reverse lookup — every active name an address owns
      parameters:
        - $ref: '#/components/parameters/address'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NameRecord'
              example:
                - steemAccount: blaze.apps
                  address: steem107662cdhfe760n2lk9yhsv8fdve3pkzhlmtsvu
                  registrationId: '7'
                  linkedAt: '23907'
        '503':
          $ref: '#/components/responses/NameServiceUnavailable'

  /name-service/registrations-by-account/{steemAccount}:
    get:
      tags: [Name Service (SVMNS)]
      summary: Full registration history for a Steem username
      description: Every registration attempt ever submitted for this account — pending, awaiting, active, superseded, and expired. The only way to enumerate a name's history, since there's no generic "list all registrations" query.
      parameters:
        - name: steemAccount
          in: path
          required: true
          schema: { type: string }
          example: blaze.apps
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NameRegistration'
              example:
                - id: '0'
                  txid: '0000000000000000000000000000000000000000'
                  opIndex: 0
                  steemBlock: '0'
                  steemTimestamp: genesis
                  steemAccount: blaze.apps
                  gatewayAccount: blaze.apps
                  amountMillisteem: '1'
                  memo: steem1l6p4lh7plepjqv2muhuk6m8k2envnvv9utknlu
                  derivedDestination: steem1l6p4lh7plepjqv2muhuk6m8k2envnvv9utknlu
                  destinationType: DESTINATION_TYPE_COSMOS
                  status: NAME_REGISTRATION_STATUS_SUPERSEDED
                  createdAtHeight: '0'
                  awaitingSinceHeight: '0'
                  confirmedAtHeight: '0'
                  confirmTxHash: ''
                  validatorConfirmations: []
        '503':
          $ref: '#/components/responses/NameServiceUnavailable'

  /name-service/registrations/pending:
    get:
      tags: [Name Service (SVMNS)]
      summary: Registrations still accumulating validator attestations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NameRegistration'
              example: []
        '503':
          $ref: '#/components/responses/NameServiceUnavailable'

  /name-service/registrations/awaiting:
    get:
      tags: [Name Service (SVMNS)]
      summary: Registrations awaiting the destination's confirm-name transaction
      description: Reached the attestation threshold but not yet confirmed by the destination address.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NameRegistration'
              example: []
        '503':
          $ref: '#/components/responses/NameServiceUnavailable'

  /name-service/registrations/{id}:
    get:
      tags: [Name Service (SVMNS)]
      summary: Get a registration by id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          example: '26'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NameRegistration'
              example:
                id: '26'
                txid: 13e5acea13fd674e3f4ed6f2819d8c423d7a6107
                opIndex: 0
                steemBlock: '108627196'
                steemTimestamp: '2026-08-12T13:53:33Z'
                steemAccount: steem-agora
                gatewayAccount: svm.bank
                amountMillisteem: '1'
                memo: svm-register steem1p58n3cf3jjhsx2q5hy0n5t6ygulwg6x7ewqfjk
                derivedDestination: steem1p58n3cf3jjhsx2q5hy0n5t6ygulwg6x7ewqfjk
                destinationType: DESTINATION_TYPE_COSMOS
                status: NAME_REGISTRATION_STATUS_ACTIVE
                createdAtHeight: '360730'
                awaitingSinceHeight: '360738'
                confirmedAtHeight: '360769'
                confirmTxHash: ad399b7828dcfb8e4734af7a79523b879f9e25c008f3614ee335936ef1159da7
                validatorConfirmations:
                  - validatorAddress: steemvaloper1u96tympny5r8m76psg5jr7fm8kcrg76wms5jgt
                    moniker: dhaka.witness
                    timestamp: '1786542867'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/NameServiceUnavailable'

components:
  parameters:
    page:
      name: page
      in: query
      description: 0-indexed page number.
      schema: { type: integer, default: 0, minimum: 0 }
    perPage:
      name: perPage
      in: query
      description: Items per page (endpoint-specific default and max).
      schema: { type: integer, minimum: 1, maximum: 200 }
    height:
      name: height
      in: path
      required: true
      schema: { type: integer }
      example: 353345
    hash:
      name: hash
      in: path
      required: true
      description: Cosmos transaction hash, case-insensitive.
      schema: { type: string }
      example: C05E4276B2B53C907E600335B67C3AD7F6A5BA028B87F841D7D65AB542DB5A0F
    address:
      name: address
      in: path
      required: true
      description: bech32 account address.
      schema: { type: string }
      example: steem107662cdhfe760n2lk9yhsv8fdve3pkzhlmtsvu

  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: 'Not found' }
    BadRequest:
      description: Invalid parameter
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: 'Invalid block height' }
    NameServiceUnavailable:
      description: STEEMBRIDGE_LCD_URL isn't configured on this deployment
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: 'Name service unavailable' }

  schemas:
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
      required: [error]

    PaginationMeta:
      type: object
      properties:
        page: { type: integer }
        perPage: { type: integer }
        total: { type: integer }
      required: [page, perPage, total]

    Coin:
      type: object
      properties:
        denom: { type: string }
        amount: { type: string }
      required: [denom, amount]

    HealthResponse:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded] }
        mongo: { type: boolean }
        chain: { type: boolean }
        indexerMode: { type: string, enum: [backfill, live] }
        lastIndexedHeight: { type: integer }
      required: [status, mongo, chain, indexerMode, lastIndexedHeight]

    NetworkStatusResponse:
      type: object
      properties:
        chainId: { type: string }
        blockHeight: { type: integer }
        catchingUp: { type: boolean }
        peered: { type: integer }
        blockInterval: { type: number, description: Average seconds between blocks. }
      required: [chainId, blockHeight, catchingUp, peered, blockInterval]

    BlockSummary:
      type: object
      properties:
        height: { type: integer }
        hash: { type: string }
        time: { type: string, format: date-time }
        proposerAddress: { type: string }
        appHash: { type: string }
        txCount: { type: integer }
      required: [height, hash, time, proposerAddress, appHash, txCount]

    BlockDetailResponse:
      allOf:
        - $ref: '#/components/schemas/BlockSummary'
        - type: object
          properties:
            txHashes:
              type: array
              items: { type: string }
          required: [txHashes]

    TransactionSummary:
      type: object
      properties:
        hash: { type: string }
        height: { type: integer }
        timestamp: { type: string, format: date-time }
        code: { type: integer, description: 0 means success. }
        success: { type: boolean }
        messageTypes:
          type: array
          items: { type: string }
        fee:
          type: array
          items: { $ref: '#/components/schemas/Coin' }
        gasUsed: { type: string }
        gasWanted: { type: string }
      required: [hash, height, timestamp, code, success, messageTypes, fee, gasUsed, gasWanted]

    DecodeMsg:
      type: object
      description: A decoded Cosmos SDK message. `data`'s shape depends on `typeUrl` — see the message-type registry in `packages/shared/src/encoding/msg.ts`.
      properties:
        typeUrl: { type: string }
        data:
          type: [object, 'null']
          additionalProperties: true
      required: [typeUrl, data]

    EventAttribute:
      type: object
      properties:
        key: { type: string }
        value: { type: string }
        index: { type: boolean }
      required: [key, value]

    TxEvent:
      type: object
      properties:
        type: { type: string }
        attributes:
          type: array
          items: { $ref: '#/components/schemas/EventAttribute' }
      required: [type, attributes]

    IBCTransferFields:
      type: object
      properties:
        sender: { type: string }
        receiver: { type: string }
        sourceChannel: { type: string }
        sourcePort: { type: string }
        destinationChannel: { type: string }
        destinationPort: { type: string }
        amount: { type: string }
        denom: { type: string }
        memo: { type: string }
      required: [sender, receiver, sourceChannel, sourcePort, destinationChannel, destinationPort, amount, denom, memo]

    TransactionDetailResponse:
      allOf:
        - $ref: '#/components/schemas/TransactionSummary'
        - type: object
          properties:
            log: { type: string }
            memo: { type: string }
            chainId: { type: string }
            messages:
              type: array
              items: { $ref: '#/components/schemas/DecodeMsg' }
            events:
              type: array
              items: { $ref: '#/components/schemas/TxEvent' }
            senders:
              type: array
              items: { type: string }
            ibcTransfer:
              oneOf:
                - $ref: '#/components/schemas/IBCTransferFields'
                - type: 'null'
          required: [log, memo, chainId, messages, events, senders, ibcTransfer]

    ValidatorSummary:
      type: object
      properties:
        operatorAddress: { type: string }
        moniker: { type: string }
        identity: { type: string }
        status: { type: string }
        jailed: { type: boolean }
        tokens: { type: string }
        bondDenom: { type: string }
        commissionRate: { type: string }
        votingPowerPercent: { type: number }
      required: [operatorAddress, moniker, identity, status, jailed, tokens, bondDenom, commissionRate, votingPowerPercent]

    ValidatorUptime:
      type: object
      properties:
        missedBlocksCounter: { type: string }
        signedBlocksWindow: { type: string }
      required: [missedBlocksCounter, signedBlocksWindow]

    ValidatorDetailResponse:
      allOf:
        - $ref: '#/components/schemas/ValidatorSummary'
        - type: object
          properties:
            website: { type: string }
            details: { type: string }
            delegatorShares: { type: string }
            minSelfDelegation: { type: string }
            unbondingHeight: { type: string }
            consensusPubkey:
              oneOf: [{ type: string }, { type: 'null' }]
            uptime:
              oneOf:
                - $ref: '#/components/schemas/ValidatorUptime'
                - type: 'null'
          required: [website, details, delegatorShares, minSelfDelegation, unbondingHeight, consensusPubkey, uptime]

    ValidatorStats:
      type: object
      properties:
        activeCount: { type: integer }
        totalCount: { type: integer }
        avgCommission: { type: number }
      required: [activeCount, totalCount, avgCommission]

    ProposalSummary:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        status: { type: string }
        votingStartTime: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        votingEndTime: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        submitTime: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
      required: [id, title, status, votingStartTime, votingEndTime, submitTime]

    ProposalDetailResponse:
      allOf:
        - $ref: '#/components/schemas/ProposalSummary'
        - type: object
          properties:
            summary: { type: string }
            proposer: { type: string }
            depositEndTime: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
            totalDeposit:
              type: array
              items: { $ref: '#/components/schemas/Coin' }
            finalTallyResult:
              oneOf:
                - type: object
                  properties:
                    yesCount: { type: string }
                    noCount: { type: string }
                    abstainCount: { type: string }
                    noWithVetoCount: { type: string }
                  required: [yesCount, noCount, abstainCount, noWithVetoCount]
                - type: 'null'
            messages:
              type: array
              items: { $ref: '#/components/schemas/DecodeMsg' }
          required: [summary, proposer, depositEndTime, totalDeposit, finalTallyResult, messages]

    ProposalStats:
      type: object
      properties:
        total: { type: integer }
        activeVoting: { type: integer }
        passed: { type: integer }
      required: [total, activeVoting, passed]

    AccountValidatorLink:
      type: object
      properties:
        operatorAddress: { type: string }
        moniker: { type: string }
        identity: { type: string }
      required: [operatorAddress, moniker, identity]

    ResolvedDenom:
      type: object
      properties:
        baseDenom: { type: string }
        symbol: { type: string }
        decimals: { type: integer }
        path: { oneOf: [{ type: string }, { type: 'null' }] }
      required: [baseDenom, symbol, decimals, path]

    AccountDetailResponse:
      type: object
      properties:
        address: { type: string }
        accountNumber: { type: string }
        sequence: { type: string }
        balances:
          type: array
          items: { $ref: '#/components/schemas/Coin' }
        stakedBalance:
          oneOf:
            - $ref: '#/components/schemas/Coin'
            - type: 'null'
        validator:
          oneOf:
            - $ref: '#/components/schemas/AccountValidatorLink'
            - type: 'null'
        resolvedDenoms:
          type: object
          additionalProperties: { $ref: '#/components/schemas/ResolvedDenom' }
      required: [address, accountNumber, sequence, balances, stakedBalance, validator, resolvedDenoms]

    RecentAccount:
      type: object
      properties:
        address: { type: string }
        lastMessageType: { type: string }
        lastActivityTime: { type: string, format: date-time }
      required: [address, lastMessageType, lastActivityTime]

    IBCTransferSummary:
      allOf:
        - $ref: '#/components/schemas/IBCTransferFields'
        - type: object
          properties:
            hash: { type: string }
            height: { type: integer }
            timestamp: { type: string, format: date-time }
            status: { type: string, enum: [success, failed] }
          required: [hash, height, timestamp, status]

    EvmTokenTransfer:
      type: object
      properties:
        type: { type: string, enum: [token_transfer, token_minting] }
        from: { type: string }
        to: { type: string }
        tokenAddress: { type: string }
        tokenName: { oneOf: [{ type: string }, { type: 'null' }] }
        tokenSymbol: { oneOf: [{ type: string }, { type: 'null' }] }
        tokenDecimals: { oneOf: [{ type: string }, { type: 'null' }] }
        amount: { oneOf: [{ type: string }, { type: 'null' }] }
      required: [type, from, to, tokenAddress, tokenName, tokenSymbol, tokenDecimals, amount]

    EvmTransactionDetails:
      type: object
      properties:
        hash: { type: string }
        status: { type: string, enum: [ok, error] }
        method: { oneOf: [{ type: string }, { type: 'null' }], description: A best-effort label for known selectors (e.g. ERC-20 transfer); null for a plain value transfer or an unrecognized selector. }
        from: { type: string }
        to: { oneOf: [{ type: string }, { type: 'null' }] }
        toIsContract: { type: boolean }
        value: { type: string, description: 'Native asteem transferred, 18 decimals.' }
        gasUsed: { type: string }
        tokenTransfers:
          type: array
          items: { $ref: '#/components/schemas/EvmTokenTransfer' }
        explorerUrl: { oneOf: [{ type: string }, { type: 'null' }] }
      required: [hash, status, method, from, to, toIsContract, value, gasUsed, tokenTransfers, explorerUrl]

    AddressTokenHolding:
      type: object
      properties:
        tokenAddress: { type: string }
        tokenType: { type: string }
        name: { oneOf: [{ type: string }, { type: 'null' }] }
        symbol: { oneOf: [{ type: string }, { type: 'null' }] }
        decimals: { oneOf: [{ type: string }, { type: 'null' }] }
        value: { type: string }
      required: [tokenAddress, tokenType, name, symbol, decimals, value]

    LiquidityPoolTokenInfo:
      type: object
      properties:
        address: { type: string }
        name: { oneOf: [{ type: string }, { type: 'null' }] }
        symbol: { oneOf: [{ type: string }, { type: 'null' }] }
        decimals: { oneOf: [{ type: string }, { type: 'null' }] }
      required: [address, name, symbol, decimals]

    LiquidityPoolSummary:
      type: object
      properties:
        poolAddress: { type: string }
        factoryAddress: { type: string }
        token0: { $ref: '#/components/schemas/LiquidityPoolTokenInfo' }
        token1: { $ref: '#/components/schemas/LiquidityPoolTokenInfo' }
        fee: { type: string, description: 'Hundredths of a basis point, e.g. "2500" = 0.25%.' }
        tickSpacing: { type: string }
        createdAtHeight: { type: integer }
        createdAtTxHash: { type: string }
        createdAt: { type: string, format: date-time }
      required: [poolAddress, factoryAddress, token0, token1, fee, tickSpacing, createdAtHeight, createdAtTxHash, createdAt]

    BridgeValidatorConfirmation:
      type: object
      properties:
        validatorAddress: { type: string }
        moniker: { oneOf: [{ type: string }, { type: 'null' }] }
        timestamp: { type: string, description: Unix seconds. }
      required: [validatorAddress, moniker, timestamp]

    BridgeDeposit:
      type: object
      properties:
        id: { type: string }
        txid: { type: string, description: Steem transaction id. }
        opIndex: { type: integer }
        steemBlock: { type: string }
        steemTimestamp: { type: string, format: date-time }
        steemSender: { type: string }
        gatewayAccount: { type: string }
        amountMillisteem: { type: string }
        memo: { type: string }
        derivedDestination: { type: string }
        destinationType: { type: string, enum: [DESTINATION_TYPE_NONE, DESTINATION_TYPE_COSMOS, DESTINATION_TYPE_EVM] }
        status: { type: string, enum: [DEPOSIT_STATUS_PENDING, DEPOSIT_STATUS_MINTED, DEPOSIT_STATUS_UNCLAIMABLE] }
        minted: { type: boolean }
        mintedAt: { type: string, description: 'SVM block height, "0" if not yet minted.' }
        mintTxHash: { type: string }
        createdAtHeight: { type: string }
        validatorConfirmations:
          type: array
          items: { $ref: '#/components/schemas/BridgeValidatorConfirmation' }
      required: [id, txid, opIndex, steemBlock, steemTimestamp, steemSender, gatewayAccount, amountMillisteem, memo, derivedDestination, destinationType, status, minted, mintedAt, mintTxHash, createdAtHeight, validatorConfirmations]

    BridgeDepositStats:
      type: object
      properties:
        pending: { type: integer }
        minted: { type: integer }
        unclaimable: { type: integer }
        total: { type: integer }
      required: [pending, minted, unclaimable, total]

    BridgeWithdrawal:
      type: object
      properties:
        id: { type: string }
        sender: { type: string, description: SVM account that burned the tokens. }
        destinationSteemAccount: { type: string }
        amountAsteem: { type: string, description: 18 decimals. }
        amountMillisteem: { type: string, description: Convenience 3-decimal duplicate of amountAsteem. }
        memo: { type: string }
        burnTxHash: { type: string, description: 'SVM chain tx hash (indexed — links to GET /transactions/{hash}).' }
        status: { type: string, enum: [WITHDRAWAL_STATUS_REQUESTED] }
        createdAtHeight: { type: string }
      required: [id, sender, destinationSteemAccount, amountAsteem, amountMillisteem, memo, burnTxHash, status, createdAtHeight]

    BridgeWithdrawalStats:
      type: object
      properties:
        total: { type: integer }
        requested: { type: integer }
        totalMintedAsteem: { type: string }
        totalBurnedAsteem: { type: string }
        netOutstandingAsteem: { type: string }
      required: [total, requested, totalMintedAsteem, totalBurnedAsteem, netOutstandingAsteem]

    NameRecord:
      type: object
      properties:
        steemAccount: { type: string }
        address: { type: string }
        registrationId: { type: string }
        linkedAt: { type: string, description: SVM block height. }
      required: [steemAccount, address, registrationId, linkedAt]

    NameRegistration:
      type: object
      properties:
        id: { type: string }
        txid: { type: string }
        opIndex: { type: integer }
        steemBlock: { type: string }
        steemTimestamp: { type: string, description: 'ISO-8601 UTC, or the literal "genesis" for a genesis-seeded registration.' }
        steemAccount: { type: string }
        gatewayAccount: { type: string }
        amountMillisteem: { type: string }
        memo: { type: string }
        derivedDestination: { type: string }
        destinationType: { type: string, enum: [DESTINATION_TYPE_NONE, DESTINATION_TYPE_COSMOS, DESTINATION_TYPE_EVM] }
        status: { type: string, description: 'One of NAME_REGISTRATION_STATUS_{PENDING,AWAITING,ACTIVE,SUPERSEDED,EXPIRED}.' }
        createdAtHeight: { type: string }
        awaitingSinceHeight: { type: string }
        confirmedAtHeight: { type: string }
        confirmTxHash: { type: string }
        validatorConfirmations:
          type: array
          items: { $ref: '#/components/schemas/BridgeValidatorConfirmation' }
      required: [id, txid, opIndex, steemBlock, steemTimestamp, steemAccount, gatewayAccount, amountMillisteem, memo, derivedDestination, destinationType, status, createdAtHeight, awaitingSinceHeight, confirmedAtHeight, confirmTxHash, validatorConfirmations]

    ChainParamsResponse:
      type: object
      properties:
        staking: { type: [object, 'null'], additionalProperties: true }
        mint: { type: [object, 'null'], additionalProperties: true }
        distribution: { type: [object, 'null'], additionalProperties: true }
        slashing: { type: [object, 'null'], additionalProperties: true }
        gov:
          type: object
          properties:
            votingParams: { type: [object, 'null'], additionalProperties: true }
            depositParams: { type: [object, 'null'], additionalProperties: true }
            tallyParams: { type: [object, 'null'], additionalProperties: true }
      required: [staking, mint, distribution, slashing, gov]

    DenomMetadataResponse:
      type: object
      properties:
        denom: { type: string }
        displayName: { type: string }
        symbol: { type: string }
        decimals: { type: integer }
        source: { type: string, enum: [seed, manual, fallback] }
      required: [denom, displayName, symbol, decimals, source]
